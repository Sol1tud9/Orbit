<html lang="ru">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eeeee4" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("orbita:theme") === "dark" ? "dark" : "light";

      name="description"
      content="Орбита — проектирование спутниковой группировки, анализ покрытия, маршрутов и перерывов связи."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Орбита — спутниковая сеть</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
