services:
  app:
    environment:
      ORBITA_SECURE_COOKIE: "0"
    cpus: 3
    mem_limit: 4g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    environment:
      ORBITA_DOMAIN: "http://${ORBITA_HOST:?Set ORBITA_HOST to the server IP}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy-data:
  caddy-config:
